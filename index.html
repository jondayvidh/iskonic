<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ISKOnic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content-wrapper">
        <div class="main-container" id="player">
            <div class="left-column">
                <div class="media-hub">
                    <div class="cover-frame" id="coverFrame">
                        <img src="cover.jpg" alt="" aria-hidden="true" class="cover-glow">
                        <img src="cover.jpg" alt="PUP Logo" class="cover-art">
                    </div>
                    <div class="song-info">
                        <h2>Imno ng PUP</h2>
                        <p>S. Calabig, S. Roldan, and R. Amaranto</p>
                    </div>
                </div>

                <div class="controls-container">
                    <div class="progress-area">
                        <input type="range" id="progressBar" value="0" max="100">
                        <div class="time-display">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>

                    <div class="transport-row">
                        <button id="prevBtn" class="ctrl-btn" title="Previous">
                            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                        </button>

                        <button id="playBtn" class="play-btn">
                            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>

                        <button id="nextBtn" class="ctrl-btn" title="Next">
                            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                        </button>
                    </div>

                    <div class="volume-row">
                        <button id="muteBtn" class="ctrl-btn mute-btn" title="Mute">
                            <svg id="muteIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        </button>
                        <div class="volume-track">
                            <input type="range" id="volumeSlider" value="1" min="0" max="1" step="0.05">
                        </div>
                        <button id="lyricsToggle" class="ctrl-btn lyrics-toggle" title="Lyrics" aria-label="Show lyrics" aria-pressed="false">
                            <svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M7.5 9h9M7.5 12.5h5.5"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="lyrics-container" id="lyricsContainer"></div>
        </div>
    </div>

    <audio id="audio" src="pup-hymn.mp3"></audio>
    <script src="script.js"></script>
</body>
</html>
