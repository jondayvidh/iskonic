<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#14060a">
    <title>ISKOnic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="content-wrapper">
        <main class="main-container" id="player">
            <div class="left-column">
                <div class="media-hub">
                    <div class="cover-frame" id="coverFrame">
                        <img src="cover.jpg" alt="" aria-hidden="true" class="cover-glow">
                        <img src="cover.jpg" alt="PUP Logo" class="cover-art">
                    </div>
                    <div class="song-info" lang="fil">
                        <h1>Imno ng PUP</h1>
                        <p>S. Calabig, S. Roldan, and R. Amaranto</p>
                    </div>
                </div>

                <div class="controls-container">
                    <div class="progress-area">
                        <input type="range" id="progressBar" value="0" max="100" aria-label="Seek">
                        <div class="time-display">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>

                    <div class="transport-row">
                        <button id="prevBtn" class="ctrl-btn" title="Previous">
                            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                        </button>

                        <button id="playBtn" class="play-btn" title="Play" aria-label="Play">
                            <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
                        </button>

                        <button id="nextBtn" class="ctrl-btn" title="Next">
                            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                        </button>
                    </div>

                    <div class="volume-row">
                        <button id="muteBtn" class="ctrl-btn mute-btn" title="Mute" aria-label="Mute">
                            <svg id="muteIcon" viewBox="0 0 24 24"><path d="M4 9.5h2.8l4.2-3.5a.6.6 0 0 1 1 .46v11.08a.6.6 0 0 1-1 .46L6.8 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z"/></svg>
                        </button>
                        <div class="volume-track">
                            <input type="range" id="volumeSlider" value="1" min="0" max="1" step="0.05" aria-label="Volume" aria-valuetext="100%">
                        </div>
                        <svg id="volumeMaxIcon" class="vol-max" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 9.5h2.8l4.2-3.5a.6.6 0 0 1 1 .46v11.08a.6.6 0 0 1-1 .46L6.8 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z"/>
                            <path class="wave" d="M15.5 9.6a3.5 3.5 0 0 1 0 4.8"/>
                            <path class="wave" d="M18 7.6a6.8 6.8 0 0 1 0 8.8"/>
                            <path class="wave" d="M20.5 5.6a10 10 0 0 1 0 12.8"/>
                        </svg>
                    </div>
                    <button id="lyricsToggle" class="ctrl-btn lyrics-toggle" title="Lyrics" aria-label="Lyrics" aria-pressed="false">
                        <svg viewBox="0 0 24 24"><path d="M6 4h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3h-7l-3.4 3c-.5.4-1.1.1-1.1-.5V17H6a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/><circle class="dot" cx="9.4" cy="9.6" r="1.3"/><circle class="dot" cx="14.6" cy="9.6" r="1.3"/><path d="M9.4 10.8c0 .9-.4 1.5-1.1 1.9M14.6 10.8c0 .9-.4 1.5-1.1 1.9"/></svg>
                    </button>
                </div>
            </div>

            <div class="lyrics-container" id="lyricsContainer" role="group" aria-label="Lyrics"></div>
        </main>
    </div>

    <div id="status" class="visually-hidden" role="status"></div>
    <audio id="audio" src="pup-hymn.mp3" preload="metadata"></audio>
    <script src="script.js"></script>
</body>
</html>
